name: Build FamilySOS APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found"
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          SETTINGS_FILE=$(find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android project root not found"
            find extracted -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      - name: Fix missing Android theme
        shell: bash
        run: |
          mkdir -p "$PROJECT_DIR/app/src/main/res/values"

          cat > "$PROJECT_DIR/app/src/main/res/values/themes.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="Theme.FamilySOS" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:windowNoTitle">true</item>
              </style>

          </resources>
          EOF

          echo "Created Theme.FamilySOS"
          cat "$PROJECT_DIR/app/src/main/res/values/themes.xml"
      - name: Install Gradle 8.10.2
        shell: bash
        run: |
          echo "Downloading Gradle 8.10.2..."

          curl -L \
            https://services.gradle.org/distributions/gradle-8.10.2-bin.zip \
            -o /tmp/gradle.zip

          mkdir -p /tmp/gradle
          unzip -q /tmp/gradle.zip -d /tmp/gradle

          GRADLE_BIN="/tmp/gradle/gradle-8.10.2/bin/gradle"

          if [ ! -f "$GRADLE_BIN" ]; then
            echo "ERROR: Gradle 8.10.2 executable not found"
            exit 1
          fi

          chmod +x "$GRADLE_BIN"

          echo "GRADLE_BIN=$GRADLE_BIN" >> "$GITHUB_ENV"

          "$GRADLE_BIN" --version
      - name: Build Debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          "$GRADLE_BIN" assembleDebug --stacktrace

      - name: Find generated APK
        shell: bash
        run: |
          echo "Generated APK files:"
          find "$PROJECT_DIR" -type f -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FamilySOS-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
