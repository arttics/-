name: Build FamilySOS APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository"
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          GRADLEW=$(find extracted -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found inside the ZIP"
            find extracted -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Android project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build Debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Find generated APK
        shell: bash
        run: |
          echo "Generated APK files:"
          find "$PROJECT_DIR" -type f -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FamilySOS-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
